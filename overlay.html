<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>납품알리미 미니창</title>
<!--
  WEB_OVERLAY_SHELL_V1
  Android 미니창(내비 위 플로팅 창)의 화면입니다.
  APK 의 WebOverlayController 가 이 페이지를 불러와 창 안에 표시합니다.
  이 파일을 GitHub 에 올리면 웹 반영만으로 즉시 최신 미니창 UI가 적용됩니다.

  네이티브 → 페이지 : window.nkRender(payload), window.nkSetCollapsed(bool)
  페이지 → 네이티브 : OverlayHost.ready / setSize / beginDrag / snapEdge / callMain / startNavi / launchNaviUrl / callPhone / sendSms / copyText / openApp / close / log
  ?demo=1 을 붙이면 브라우저에서 모든 기능을 미리보기·조작할 수 있습니다.
-->
<style>
  :root {
    color-scheme: dark;
    --ov-win-opacity: 1;
    --ov-w-bg: rgba(12, 20, 36, 0.92);
    --ov-col-bg: rgba(12, 20, 36, 0.88);
    --ov-border: rgba(56, 189, 248, 0.58);
    --ov-arr-border: #F59E0B;
    --ov-ink: #F8FAFC;
    --ov-muted: #94A3B8;
    --ov-dist: #38BDF8;
    --ov-item-bg: rgba(23, 37, 61, 0.90);
    --ov-item-bd: rgba(71, 85, 105, 0.78);
    --ov-item-on-bg: rgba(6, 78, 59, 0.90);
    --ov-item-on-bd: rgba(52, 211, 153, 0.92);
    --ov-item-on-ink: #6EE7B7;
    --ov-card-bg: rgba(18, 31, 52, 0.88);
    --ov-card-bd: rgba(51, 65, 85, 0.82);
    --ov-menu-bg: rgba(15, 23, 42, 0.97);
    --ov-btn-bg: rgba(30, 41, 59, 0.92);
    --ov-btn-bd: rgba(71, 85, 105, 0.85);
    --ov-qty-bg: rgba(245, 158, 11, 0.18);
    --ov-qty-bd: rgba(245, 158, 11, 0.48);
    --ov-qty-ink: #FDE047;
    --ov-warn-bg: rgba(244, 63, 94, 0.20);
    --ov-warn-bd: rgba(244, 63, 94, 0.58);
    --ov-warn-ink: #FDA4AF;
    --ov-urgent-bg: rgba(245, 158, 11, 0.20);
    --ov-urgent-bd: rgba(245, 158, 11, 0.58);
    --ov-urgent-ink: #FDE68A;
    --ov-undo-bg: rgba(120, 53, 15, 0.92);
    --ov-undo-bd: #F59E0B;
    --ov-undo-ink: #FEF3C7;
    --ov-text-shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #w {
    width: 262px; padding: 7px 8px 8px; border-radius: 16px;
    border: 2px solid var(--ov-border);
    background: var(--ov-w-bg); color: var(--ov-ink);
    opacity: var(--ov-win-opacity);
    text-shadow: var(--ov-text-shadow);
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  #w.sz-sm { width: 228px; padding: 6px 7px 7px; }
  #w.sz-lg { width: 292px; padding: 8px 10px 9px; }
  #w.collapsed {
    width: 226px !important; padding: 6px 8px; border-width: 1.8px; border-radius: 15px;
    background: var(--ov-col-bg);
  }
  #w.sz-sm.collapsed { width: 200px !important; padding: 5px 7px; }
  #w.sz-lg.collapsed { width: 252px !important; padding: 7px 9px; }

  #w.arrived {
    border-color: var(--ov-arr-border) !important;
    box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.42);
  }
  #w.ready-complete #doneNext {
    box-shadow: 0 0 0 2px #BBF7D0, 0 0 12px rgba(34, 197, 94, 0.55);
  }

  /* Light / Sunlight High-Contrast Theme */
  #w.theme-light { color-scheme: light; }
  #w.theme-light #memoBtn { color: #0369A1; }
  #w.theme-light #addrBar { color: #1E293B; }
  #w.theme-light .step-btn { color: #0F172A; background: #E2E8F0; border-color: #94A3B8; }
  #w.theme-light .empty { color: #475569; }
  #w.theme-light #nextPreview { color: #1E3A8A; background: rgba(219, 234, 254, 0.88); border-color: #60A5FA; }
  #w.theme-light #checkAllBtn { color: #065F46; background: #D1FAE5; border-color: #10B981; }
  #w.theme-light #menu, #w.theme-light #cfgMenu, #w.theme-light #holdMenu, #w.theme-light #smsMenu {
    color: #0F172A; border-color: #CBD5E1;
  }
  #w.theme-light #menu .menu-sec-label, #w.theme-light #cfgMenu .menu-sec-label { color: #475569; }
  #w.theme-light #menu .menu-sec-label strong, #w.theme-light #cfgMenu .menu-sec-label strong { color: #0369A1; }
  #w.theme-light #menu button, #w.theme-light #cfgMenu button, #w.theme-light #holdMenu button, #w.theme-light #smsMenu button {
    color: #0F172A; background: #E2E8F0; border-color: #CBD5E1;
  }
  #w.theme-light #menu button.on, #w.theme-light #cfgMenu button.on {
    color: #FFFFFF; background: #2563EB; border-color: #1D4ED8;
  }
  #w.theme-light #close {
    color: #FFFFFF !important; background: #DC2626 !important; border-color: #B91C1C !important;
  }
  #w.theme-light .memo-chip { color: #0369A1; background: #E0F2FE; border-color: #7DD3FC; }
  #w.theme-light .memo-chip.edit-chip { color: #92400E; background: #FEF3C7; border-color: #F59E0B; }
  #w.theme-light #holdHint { color: #92400E; background: #FEF3C7; border-color: #F59E0B; }
  #w.theme-light #callBtn { color: #065F46; background: #D1FAE5; border-color: #10B981; }
  #w.theme-light #smsBtn { color: #075985; background: #E0F2FE; border-color: #0EA5E9; }
  #w.theme-light #photoBtn { color: #3730A3; background: #E0E7FF; border-color: #6366F1; }
  #w.theme-light #speakBtn { color: #3730A3; background: #E0E7FF; border-color: #6366F1; }
  #w.theme-light #holdBtn { color: #92400E; background: #FEF3C7; border-color: #F59E0B; }
  #w.theme-light #next { color: #1E3A8A; background: #DBEAFE; border-color: #60A5FA; }
  #w.theme-light #addrBtn { color: #075985; background: #E0F2FE; border-color: #38BDF8; }
  #w.theme-light #app { color: #1E293B; background: #E2E8F0; border-color: #94A3B8; }

  .row { display: flex; align-items: center; gap: 4px; }
  button { font: inherit; font-weight: 800; color: inherit; border: 0; border-radius: 10px; cursor: pointer; padding: 0; }
  button:active { filter: brightness(1.16); }
  button:disabled { opacity: 0.42; cursor: default; filter: none; }

  /* GPS Status Dot */
  .gps-dot {
    flex: none; width: 8px; height: 8px; border-radius: 999px;
    background: #64748B; box-shadow: 0 0 0 1px rgba(255,255,255,0.28);
  }
  .gps-dot.live { background: #10B981; box-shadow: 0 0 6px #10B981; }
  .gps-dot.weak { background: #F59E0B; box-shadow: 0 0 5px #F59E0B; }
  .gps-dot.searching { background: #FBBF24; animation: ovPulse 1.1s infinite; }
  .gps-dot.manual { background: #38BDF8; }
  .gps-dot.denied { background: #EF4444; }
  @keyframes ovPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(0.82); } }

  /* =========================================================
     1. ULTRA-SLIM DRIVING CAPSULE (Collapsed Mode ~9% area)
     ========================================================= */
  #drivingPill { display: none; flex-direction: column; gap: 5px; touch-action: none; }
  #w.collapsed #drivingPill { display: flex; }
  #w.collapsed #header,
  #w.collapsed #menu,
  #w.collapsed #cfgMenu,
  #w.collapsed #undoBar,
  #w.collapsed #heroCard,
  #w.collapsed #body { display: none !important; }

  .pill-top {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    min-width: 0; cursor: pointer;
  }
  .pill-name-wrap { display: flex; align-items: center; gap: 5px; min-width: 0; flex: 1; }
  #colName {
    font-size: 12px; font-weight: 900; color: var(--ov-ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #w.sz-sm #colName { font-size: 11px; }
  #w.sz-lg #colName { font-size: 13px; }
  #colDist {
    flex: none; font-size: 11.5px; font-weight: 900; color: var(--ov-dist); white-space: nowrap;
  }
  .pill-bottom {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  #colQty {
    display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 8px;
    font-size: 13.5px; font-weight: 900; line-height: 1.15;
    background: var(--ov-qty-bg); border: 1px solid var(--ov-qty-bd); color: var(--ov-qty-ink);
    white-space: nowrap; max-width: 116px; overflow: hidden; text-overflow: ellipsis;
  }
  #w.sz-sm #colQty { font-size: 12px; padding: 2px 6px; }
  #w.sz-lg #colQty { font-size: 15px; padding: 4px 9px; }
  .pill-btns { display: flex; align-items: center; gap: 4px; flex: none; }
  #colSpeak {
    min-width: 30px; min-height: 28px; padding: 0 7px; font-size: 12px; border-radius: 8px;
    color: var(--ov-ink); background: var(--ov-btn-bg); border: 1px solid var(--ov-btn-bd);
  }
  #colExpand {
    min-height: 28px; padding: 0 8px; font-size: 11px; font-weight: 900; border-radius: 8px;
    color: #FFFFFF; background: #2563EB; border: 1px solid #60A5FA; white-space: nowrap;
  }
  #colUrgent {
    display: none; font-size: 10.5px; font-weight: 800; line-height: 1.25;
    padding: 3px 6px; border-radius: 7px;
    background: var(--ov-urgent-bg); border: 1px solid var(--ov-urgent-bd); color: var(--ov-urgent-ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #colUrgent.open { display: block; }
  #colUrgent.is-danger {
    background: var(--ov-warn-bg); border-color: var(--ov-warn-bd); color: var(--ov-warn-ink);
  }

  /* =========================================================
     2. CLEAN EXPANDED HEADER (No accidental X close button!)
     ========================================================= */
  #header { padding-bottom: 5px; touch-action: none; }
  #badge {
    flex: none; max-width: 96px; min-height: 26px; padding: 3px 7px; font-size: 10px;
    font-weight: 900; color: #fff; background: #059669; border-radius: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #w.arrived #badge { color: #020617; background: #F59E0B !important; }
  #dist {
    flex: 1; min-width: 0; font-size: 11.5px; font-weight: 900; color: var(--ov-dist);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 3px 2px; touch-action: none;
  }
  #w.sz-sm #dist { font-size: 10.5px; }
  #w.sz-lg #dist { font-size: 12.5px; }
  #alphaBtn, #collapse {
    flex: none; min-width: 28px; min-height: 28px; padding: 0 7px; font-size: 12px;
    border-radius: 8px; color: var(--ov-ink); background: var(--ov-btn-bg); border: 1px solid var(--ov-btn-bd);
    display: inline-flex; align-items: center; justify-content: center;
  }
  #alphaBtn.is-open { border-color: #38BDF8; box-shadow: 0 0 0 1px #38BDF8; }

  /* =========================================================
     3. MENUS (Quick Switcher & Settings with Safe Close)
     ========================================================= */
  #menu, #cfgMenu, #holdMenu, #smsMenu {
    display: none; margin: 2px 0 6px; padding: 6px;
    background: var(--ov-menu-bg); border: 1px solid #334155; border-radius: 12px;
  }
  #menu.open, #cfgMenu.open { display: block; max-height: 300px; overflow-y: auto; overscroll-behavior: contain; }
  #holdMenu.open, #smsMenu.open { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin: 5px 0 2px; }
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .menu-sec-label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 9.5px; color: #94A3B8; margin: 7px 0 3px; font-weight: 800;
  }
  .menu-sec-label strong { color: #38BDF8; font-weight: 800; }
  .menu-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
  .menu-row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
  #menu button, #cfgMenu button, #holdMenu button, #smsMenu button {
    min-height: 28px; font-size: 10.5px; color: #fff; background: #334155;
    border: 1px solid rgba(100, 116, 139, 0.45); border-radius: 8px; padding: 3px 5px;
  }
  #menu button.on, #cfgMenu button.on { background: #2563EB; border-color: #93C5FD; color: #fff; }

  #quickList { display: flex; flex-direction: column; gap: 3px; }
  .quick-target-btn {
    display: flex !important; align-items: center; justify-content: space-between; gap: 4px;
    width: 100%; text-align: left; padding: 5px 7px !important; min-height: 28px !important; font-size: 10px !important;
  }
  .quick-target-btn .qt-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quick-target-btn .qt-meta { flex: none; font-size: 9.5px; opacity: 0.88; white-space: nowrap; }

  .slider-row { display: flex; align-items: center; gap: 4px; }
  .slider-row .adj-btn {
    flex: none; width: 26px; min-height: 26px !important; font-size: 13px !important; line-height: 1;
    border-radius: 7px; padding: 0 !important;
  }
  .slider-row input[type=range] {
    flex: 1; min-width: 0; height: 22px; accent-color: #38BDF8; cursor: pointer; margin: 0;
  }
  #holdDoneToggle.on { background: #B45309 !important; border-color: #FBBF24 !important; color: #FEF3C7 !important; }
  #unlockNearBtn, #autoNearToggle.on, #autoDriveToggle.on, #themeSyncToggle.on {
    background: #065F46 !important; border-color: #10B981 !important; color: #A7F3D0 !important;
  }
  #w.theme-light #unlockNearBtn,
  #w.theme-light #autoNearToggle.on,
  #w.theme-light #autoDriveToggle.on,
  #w.theme-light #themeSyncToggle.on {
    background: #D1FAE5 !important; border-color: #059669 !important; color: #065F46 !important;
  }
  #close {
    width: 100%; margin-top: 7px; min-height: 32px !important; font-size: 11px !important; font-weight: 900;
    color: #FECACA !important; background: #991B1B !important; border: 1px solid #EF4444 !important;
  }

  /* =========================================================
     4. UNDO BAR & 0.5-SECOND QUANTITY HERO BLOCK
     ========================================================= */
  #undoBar {
    display: none; width: 100%; margin-bottom: 5px; padding: 5px 8px; font-size: 11px; font-weight: 900;
    color: var(--ov-undo-ink); background: var(--ov-undo-bg); border: 1px solid var(--ov-undo-bd); border-radius: 10px;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #undoBar.open { display: block; }

  #heroCard {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 9px; border-radius: 12px; touch-action: none;
    background: var(--ov-qty-bg); border: 1px solid var(--ov-qty-bd);
  }
  .hero-left { flex: 1; min-width: 0; }
  #title {
    font-size: 14.5px; font-weight: 900; color: var(--ov-ink); line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #w.sz-sm #title { font-size: 13px; }
  #w.sz-lg #title { font-size: 16px; }
  #heroSteps {
    margin-top: 2px; font-size: 10.5px; font-weight: 800; color: var(--ov-qty-ink); opacity: 0.92;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #w.sz-sm #heroSteps { font-size: 9.5px; }
  #w.sz-lg #heroSteps { font-size: 11.5px; }
  #heroQty {
    flex: none; font-size: 18px; font-weight: 900; line-height: 1.05; letter-spacing: -0.02em;
    color: var(--ov-qty-ink); white-space: nowrap;
  }
  #heroQty.hidden { display: none; }
  #w.sz-sm #heroQty { font-size: 15.5px; }
  #w.sz-lg #heroQty { font-size: 20px; }

  /* =========================================================
     5. ALERT STRIPS (Urgent Time, Linked Pickup, Memo, Addr)
     ========================================================= */
  #body { padding-top: 5px; }
  #urgentStrip, #linkedStrip {
    display: none; margin-bottom: 4px; padding: 4px 8px; border-radius: 9px;
    font-size: 11px; font-weight: 900; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #urgentStrip.open {
    display: block;
    background: var(--ov-urgent-bg); border: 1px solid var(--ov-urgent-bd); color: var(--ov-urgent-ink);
  }
  #urgentStrip.open.is-danger {
    background: var(--ov-warn-bg); border-color: var(--ov-warn-bd); color: var(--ov-warn-ink);
  }
  #linkedStrip.open {
    display: block;
    background: var(--ov-warn-bg); border: 1px solid var(--ov-warn-bd); color: var(--ov-warn-ink);
  }

  #addrBar {
    display: none; margin-bottom: 4px; padding: 5px 7px; border-radius: 9px; font-size: 10px; line-height: 1.35;
    color: var(--ov-ink); background: var(--ov-card-bg); border: 1px solid var(--ov-card-bd);
    align-items: center; justify-content: space-between; gap: 5px;
  }
  #addrBar.open { display: flex; }
  #addrText { flex: 1; min-width: 0; word-break: keep-all; }
  #copyAddrBtn {
    flex: none; font-size: 9.5px; padding: 4px 7px; min-height: 24px; border-radius: 7px;
    color: #EFF6FF; background: #2563EB; border: 1px solid #60A5FA;
  }

  #memoBtn {
    display: block; width: 100%; text-align: left; margin-bottom: 4px; padding: 4px 7px; border-radius: 9px;
    font-size: 10.5px; line-height: 1.3; font-weight: 700;
    color: #BAE6FD; background: var(--ov-card-bg); border: 1px solid var(--ov-card-bd);
  }
  #memoBtn.empty-memo { opacity: 0.72; font-size: 10px; }
  #memoText {
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  #memoBtn.expanded #memoText {
    display: block; -webkit-line-clamp: unset; overflow: visible; white-space: pre-wrap; word-break: break-word;
  }
  #memoBtn.hidden { display: none !important; }
  #memoChips { display: none; flex-wrap: wrap; gap: 3px; margin-bottom: 4px; }
  #memoChips.open { display: flex; }
  .memo-chip {
    font-size: 9.5px; font-weight: 800; padding: 3px 6px; min-height: 24px; border-radius: 7px;
    color: #BAE6FD; background: rgba(30, 58, 95, 0.82); border: 1px solid rgba(56, 189, 248, 0.45);
  }
  .memo-chip.edit-chip { color: #FDE68A; background: rgba(120, 53, 15, 0.82); border-color: rgba(245, 158, 11, 0.55); }

  /* =========================================================
     6. LARGE TOUCH-FRIENDLY CHECKLIST
     ========================================================= */
  #progressRow { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 2px 1px 4px; }
  #progress { flex: 1; min-width: 0; font-size: 10.5px; font-weight: 800; color: var(--ov-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #checkAllBtn {
    flex: none; font-size: 10px; padding: 3px 7px; min-height: 22px; border-radius: 7px;
    color: #A7F3D0; background: rgba(6, 78, 59, 0.88); border: 1px solid #10B981;
  }
  #checkAllBtn.hidden { display: none; }

  #items { max-height: 124px; overflow-y: auto; overscroll-behavior: contain; }
  #w.sz-sm #items { max-height: 92px; }
  #w.sz-lg #items { max-height: 162px; }
  .item-row { display: flex; align-items: stretch; gap: 4px; margin: 0 0 4px; }
  .item {
    flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 6px;
    text-align: left; font-size: 12px; font-weight: 800; min-height: 34px; padding: 5px 8px;
    border-radius: 10px; background: var(--ov-item-bg); border: 1px solid var(--ov-item-bd); color: var(--ov-ink);
  }
  .item .it-txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #w.sz-sm .item { font-size: 11px; min-height: 30px; padding: 4px 6px; }
  #w.sz-lg .item { font-size: 13px; min-height: 38px; padding: 6px 9px; }
  .item.on {
    background: var(--ov-item-on-bg); border-color: var(--ov-item-on-bd); color: var(--ov-item-on-ink);
  }
  .item.linked { border-left: 3.5px solid #F43F5E; }
  .item.linked-extra { border-left: 3.5px solid #A855F7; }
  .step-wrap { flex: none; display: flex; gap: 3px; }
  .step-btn {
    width: 28px; min-height: 34px; font-size: 14px; font-weight: 900; border-radius: 9px;
    color: var(--ov-ink); background: var(--ov-btn-bg); border: 1px solid var(--ov-btn-bd);
    display: inline-flex; align-items: center; justify-content: center;
  }
  #w.sz-sm .step-btn { width: 24px; min-height: 30px; font-size: 12px; }
  #w.sz-lg .step-btn { width: 30px; min-height: 38px; font-size: 15px; }
  .empty { font-size: 11px; color: #94A3B8; padding: 6px 2px; }

  /* =========================================================
     7. COLLAPSIBLE SECONDARY TOOLS DRAWER (Zero Clutter!)
     ========================================================= */
  #toolsDrawer {
    display: none; margin-top: 5px; padding-top: 5px;
    border-top: 1px solid rgba(100, 116, 139, 0.35);
  }
  #toolsDrawer.open { display: block; }
  .tools-grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;
  }
  .tools-grid button {
    min-height: 34px; font-size: 11px; font-weight: 800; border-radius: 10px;
    padding: 3px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #w.sz-sm .tools-grid button { min-height: 30px; font-size: 10px; }
  #w.sz-lg .tools-grid button { min-height: 38px; font-size: 12px; }

  #callBtn { color: #A7F3D0; background: rgba(6, 78, 59, 0.88); border: 1px solid #10B981; }
  #smsBtn { color: #BAE6FD; background: rgba(12, 74, 110, 0.88); border: 1px solid #38BDF8; }
  #photoBtn { color: #E0E7FF; background: rgba(49, 46, 129, 0.88); border: 1px solid #818CF8; }
  #speakBtn { color: #C7D2FE; background: rgba(30, 27, 75, 0.88); border: 1px solid #6366F1; }
  #holdBtn { color: #FDE68A; background: rgba(66, 32, 6, 0.88); border: 1px solid #D97706; }
  #naviBtn { color: #052E16; background: #03C75A; border: 1px solid #6EE7B7; font-weight: 900; }
  #naviBtn.navi-kakao { color: #1E1B06; background: #FEE500; border-color: #FACC15; }
  #naviBtn.navi-tmap { color: #FFFFFF; background: #0064FF; border-color: #60A5FA; }
  #next { color: #DBEAFE; background: rgba(30, 58, 138, 0.88); border: 1px solid #60A5FA; }
  #addrBtn { color: #BAE6FD; background: rgba(12, 74, 110, 0.78); border: 1px solid rgba(56, 189, 248, 0.5); }
  #app { color: var(--ov-ink); background: var(--ov-btn-bg); border: 1px solid var(--ov-btn-bd); }

  #nextPreview {
    display: none; width: 100%; margin-top: 5px; padding: 5px 8px; border-radius: 9px;
    font-size: 10.5px; font-weight: 800; text-align: left;
    color: #BFDBFE; background: rgba(30, 58, 138, 0.50); border: 1px solid rgba(59, 130, 246, 0.50);
    align-items: center; justify-content: space-between; gap: 5px;
  }
  #nextPreview.open { display: flex; }
  #nextPrevName { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #nextPrevMeta { flex: none; font-size: 10px; opacity: 0.9; white-space: nowrap; }

  #holdHint {
    display: none; margin-top: 5px; padding: 4px 7px; border-radius: 8px; text-align: center;
    font-size: 10px; font-weight: 800; color: #FEF3C7; background: rgba(120, 53, 15, 0.90); border: 1px solid #F59E0B;
  }
  #holdHint.open { display: block; }

  /* =========================================================
     8. ERGONOMIC 2 PRIMARY BUTTONS + ⋯ TOGGLE (40px tall!)
     ========================================================= */
  #actions {
    display: grid; grid-template-columns: 1fr 1.55fr 40px; gap: 5px; margin-top: 6px;
  }
  #actions button {
    position: relative; overflow: hidden;
    min-height: 40px; font-size: 12px; font-weight: 900; border-radius: 11px; white-space: nowrap;
  }
  #w.sz-sm #actions { grid-template-columns: 1fr 1.5fr 36px; gap: 4px; }
  #w.sz-sm #actions button { min-height: 36px; font-size: 11px; }
  #w.sz-lg #actions { grid-template-columns: 1fr 1.55fr 44px; }
  #w.sz-lg #actions button { min-height: 44px; font-size: 13px; }
  #done { color: #F0FDFA; background: #0F766E; border: 1px solid #2DD4BF; }
  #doneNext { color: #052E16; background: #03C75A; border: 1px solid #6EE7B7; }
  #toolsToggle {
    font-size: 14px; color: var(--ov-ink); background: var(--ov-btn-bg); border: 1px solid var(--ov-btn-bd);
  }
  #toolsToggle.is-open { background: #2563EB; color: #FFFFFF; border-color: #60A5FA; }

  .hold-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: rgba(255, 255, 255, 0.34); pointer-events: none;
  }
  .holding .hold-fill { width: 100%; transition: width 0.55s linear; }
</style>
</head>
<body>
<div id="w">
  <!-- 1. 주행 중 초슬림 2줄 캡슐 (접힘 상태) -->
  <div id="drivingPill" aria-label="주행 중 미니 캡슐">
    <div class="pill-top" id="pillTapZone">
      <div class="pill-name-wrap">
        <span id="colGpsDot" class="gps-dot" title="GPS 상태"></span>
        <span id="colName">목적지 준비중</span>
      </div>
      <span id="colDist">거리 대기</span>
    </div>
    <div class="pill-bottom">
      <span id="colQty">수량 확인</span>
      <div class="pill-btns">
        <button id="colSpeak" type="button" title="수량 음성 듣기" aria-label="음성 읽기">🔊</button>
        <button id="colExpand" type="button" aria-label="펼치기">펼침 ▾</button>
      </div>
    </div>
    <div id="colUrgent"></div>
  </div>

  <!-- 2. 도착 카드 깔끔한 헤더 (오터치 유발 ✕ 버튼 제거 → ◐ 설정 안으로 이동) -->
  <div class="row" id="header">
    <span id="gpsDot" class="gps-dot" title="GPS 상태"></span>
    <button id="badge" type="button" aria-haspopup="true" aria-expanded="false" aria-label="업무 종류 및 다음 원 빠른 이동">🧭 내비고정 ▾</button>
    <div id="dist">거리 계산중</div>
    <button id="alphaBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="투명도 및 화면 설정" title="투명도·테마·안전 창닫기">◐</button>
    <button id="collapse" type="button" aria-label="주행 캡슐로 접기" title="주행 캡슐로 접기">➖</button>
  </div>

  <!-- 업무 종류 & 정거장 빠른 이동 메뉴 -->
  <div id="menu" role="group" aria-label="업무 종류 및 빠른 전환">
    <div class="menu-grid">
      <button type="button" data-kind="delivery">납품</button>
      <button type="button" data-kind="return">반품·회수</button>
      <button type="button" data-kind="extra">추가 납품</button>
      <button type="button" data-kind="auto">📍 가까운 순</button>
    </div>
    <button type="button" id="unlockNearBtn" style="display:none;width:100%;margin-top:4px">📍 내 기준 가까운 원으로 전환</button>
    <div class="menu-sec-label"><span>다음 방문처 바로가기 (가까운 순)</span><strong id="remCountLabel"></strong></div>
    <div id="quickList"></div>
  </div>

  <!-- 투명도·화면·편의 설정 메뉴 + 안전 닫기 -->
  <div id="cfgMenu" role="group" aria-label="투명도 및 창 설정">
    <div class="menu-sec-label" style="margin-top:1px"><span>배경 투명도</span><strong id="bgAlphaVal">92%</strong></div>
    <div class="slider-row">
      <button type="button" class="adj-btn" data-bg-step="-6" aria-label="배경 투명하게">−</button>
      <input id="bgAlphaRange" type="range" min="10" max="98" step="2" value="92" aria-label="배경 투명도 비율">
      <button type="button" class="adj-btn" data-bg-step="6" aria-label="배경 진하게">+</button>
    </div>

    <div class="menu-sec-label"><span>전체 창 투명도</span><strong id="winAlphaVal">100%</strong></div>
    <div class="slider-row">
      <button type="button" class="adj-btn" data-win-step="-5" aria-label="창 전체 투명하게">−</button>
      <input id="winAlphaRange" type="range" min="35" max="100" step="1" value="100" aria-label="전체 창 투명도 비율">
      <button type="button" class="adj-btn" data-win-step="5" aria-label="창 전체 진하게">+</button>
    </div>

    <div class="menu-sec-label"><span>빠른 투명도</span></div>
    <div class="menu-row4">
      <button type="button" data-preset="solid">진함</button>
      <button type="button" data-preset="mid">반투명</button>
      <button type="button" data-preset="light">투명</button>
      <button type="button" data-preset="ghost">초투명</button>
    </div>

    <div class="menu-sec-label"><span>화면 테마 (메인 앱 자동 동기화)</span></div>
    <div class="menu-grid" style="margin-bottom:4px">
      <button type="button" data-theme="dark">🌙 야간</button>
      <button type="button" data-theme="light">☀️ 주간</button>
    </div>
    <button type="button" id="themeSyncToggle" style="width:100%">🔄 메인 앱 테마 자동동기화: 켜짐</button>

    <div class="menu-sec-label"><span>창 크기</span></div>
    <div class="menu-row3">
      <button type="button" data-size="sm">작게</button>
      <button type="button" data-size="md">보통</button>
      <button type="button" data-size="lg">크게</button>
    </div>

    <div class="menu-sec-label"><span>기본 내비 앱</span></div>
    <div class="menu-row3">
      <button type="button" data-navi="naver">네이버</button>
      <button type="button" data-navi="kakao">카카오</button>
      <button type="button" data-navi="tmap">티맵</button>
    </div>

    <div class="menu-sec-label"><span>주행 자동전환 · 안전 조작</span></div>
    <div class="menu-grid" style="margin-bottom:4px">
      <button type="button" id="snapEdgeBtn">⇄ 좌우 이동</button>
      <button type="button" id="calibBtn">📍 좌표 보정</button>
    </div>
    <button type="button" id="autoDriveToggle" style="width:100%;margin-bottom:4px">🚗 주행캡슐↔도착 자동전환: 켜짐</button>
    <button type="button" id="autoNearToggle" style="width:100%;margin-bottom:4px">📍 가까운 원 자동전환: 켜짐</button>
    <button type="button" id="holdDoneToggle" style="width:100%">🔒 완료 길게누르기: 꺼짐</button>

    <button id="close" type="button" aria-label="미니창 닫기">✕ 미니창 안전 닫기</button>
    <div style="margin-top:5px;text-align:right;font-size:8.5px;opacity:0.68">미니창 v<span id="ovVerLabel"></span></div>
  </div>

  <button id="undoBar" type="button" aria-label="방금 완료 되돌리기">↩ 되돌리기</button>

  <!-- 3. 0.5초 시인성 수량 히어로 블록 -->
  <div id="heroCard">
    <div class="hero-left">
      <div id="title">목적지 준비중</div>
      <div id="heroSteps">품목 준비중</div>
    </div>
    <div id="heroQty" class="hidden"></div>
  </div>

  <div id="body">
    <div id="urgentStrip"></div>
    <div id="linkedStrip"></div>

    <div id="addrBar">
      <span id="addrText"></span>
      <button id="copyAddrBtn" type="button">📋 복사</button>
    </div>

    <button id="memoBtn" type="button" class="hidden" aria-expanded="false"><span id="memoText"></span></button>
    <div id="memoChips" role="group" aria-label="빠른 현장 메모">
      <button type="button" class="memo-chip" data-chip="정문 앞 주차">+정문주차</button>
      <button type="button" class="memo-chip" data-chip="지하주차장 이용">+지하주차</button>
      <button type="button" class="memo-chip" data-chip="2층 교무실 전달">+교무실</button>
      <button type="button" class="memo-chip" data-chip="경비실 맡김">+경비실</button>
      <button type="button" class="memo-chip" data-chip="원내 부재중">+부재중</button>
      <button type="button" class="memo-chip edit-chip" data-chip="__EDIT__">✏️ 편집</button>
    </div>

    <div id="progressRow">
      <div id="progress">품목 터치 시 즉시 체크</div>
      <button id="checkAllBtn" type="button" class="hidden">✓ 전체체크</button>
    </div>
    <div id="items"></div>

    <!-- 4. 접이식 보조 도구 서랍 (⋯ 버튼으로 필요 시 펼침) -->
    <div id="toolsDrawer" role="group" aria-label="보조 도구">
      <div class="tools-grid">
        <button id="callBtn" type="button" title="원 전화 걸기">📞 전화</button>
        <button id="smsBtn" type="button" title="도착·완료 문자 보내기">📩 문자</button>
        <button id="photoBtn" type="button" title="납품 증빙 사진 촬영">📷 사진</button>
        <button id="speakBtn" type="button" title="수량 음성 다시 듣기">🔊 읽기</button>
        <button id="holdBtn" type="button" title="보류·재방문 상태 표시">⏸ 보류</button>
        <button id="naviBtn" type="button" title="내비 길안내 출발">🟢 내비</button>
        <button id="next" type="button" title="다음 정거장으로 이동">다음 ▶</button>
        <button id="addrBtn" type="button" aria-expanded="false" title="주소 보기 및 복사">📍 주소</button>
        <button id="app" type="button" title="메인 앱 화면 열기">📱 앱열기</button>
      </div>

      <div id="holdMenu" role="group" aria-label="빠른 상태 기록">
        <button type="button" data-status="보류">⏸ 보류</button>
        <button type="button" data-status="재방문">🔁 재방문</button>
        <button type="button" data-status="연락필요">📞 연락</button>
      </div>

      <div id="smsMenu" role="group" aria-label="문자 템플릿">
        <button type="button" data-sms="arriving">🚚 곧 도착</button>
        <button type="button" data-sms="delivered">✅ 전달완료</button>
        <button type="button" data-sms="absent">🚪 부재연락</button>
      </div>

      <button id="nextPreview" type="button" title="터치하면 다음 정거장으로 이동">
        <span id="nextPrevName"></span>
        <span id="nextPrevMeta"></span>
      </button>
    </div>

    <div id="holdHint">완료 오작동 방지: 버튼을 0.6초 길게 누르세요</div>

    <!-- 5. 대형 핵심 2버튼 + 보조도구 토글(⋯) -->
    <div id="actions">
      <button id="done" type="button"><span class="hold-fill"></span>✓ 완료</button>
      <button id="doneNext" type="button"><span class="hold-fill"></span>완료 ▶ 내비</button>
      <button id="toolsToggle" type="button" aria-expanded="false" aria-label="보조 도구 열기" title="전화·문자·사진·보류·주소·앱">⋯</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var VERSION = '2026-11-27.7';
  var H = window.OverlayHost || null;
  var $ = function (id) { return document.getElementById(id); };
  var w = $('w');

  var PRESETS = {
    solid: { bg: 0.96, win: 1.00 },
    mid:   { bg: 0.86, win: 1.00 },
    light: { bg: 0.56, win: 0.96 },
    ghost: { bg: 0.24, win: 0.92 }
  };
  var NAVI_META = {
    naver: { text: '🟢 내비', title: '네이버 내비 길안내 출발', cls: '' },
    kakao: { text: '🟡 카카오', title: '카카오내비 길안내 출발', cls: 'navi-kakao' },
    tmap:  { text: '🔵 티맵', title: '티맵 길안내 출발', cls: 'navi-tmap' }
  };

  function clampNum(v, lo, hi, fallback) {
    var n = parseFloat(v);
    if (!Number.isFinite(n)) return fallback;
    return Math.max(lo, Math.min(hi, n));
  }

  var state = {
    p: {},
    kind: 'auto',
    size: 'md',
    theme: 'dark',
    themeSync: true,
    autoDrive: true,
    bgAlpha: 0.92,
    winAlpha: 1.0,
    naviApp: 'naver',
    holdDone: false,
    collapsed: false,
    menuOpen: false,
    cfgOpen: false,
    toolsOpen: false,
    holdOpen: false,
    smsOpen: false,
    addrOpen: false,
    memoExpanded: false,
    lastNearby: null,
    autoExpandSuppressUntil: 0,
    manualExpandUntil: 0
  };

  try { state.collapsed = localStorage.getItem('nk_overlay_collapsed') === '1'; } catch (e) {}
  try {
    var svSz = localStorage.getItem('nk_overlay_size');
    if (svSz === 'sm' || svSz === 'md' || svSz === 'lg') state.size = svSz;
    var svTh = localStorage.getItem('nk_overlay_theme');
    if (svTh === 'light' || svTh === 'dark') state.theme = svTh;
    var svSync = localStorage.getItem('nk_overlay_theme_sync');
    if (svSync === '0') state.themeSync = false;
    var svAd = localStorage.getItem('nk_overlay_auto_drive');
    if (svAd === '0') state.autoDrive = false;
    var svNv = localStorage.getItem('nk_overlay_navi_app');
    if (svNv && NAVI_META[svNv]) state.naviApp = svNv;
    state.holdDone = localStorage.getItem('nk_overlay_hold_done') === '1';

    var svBg = localStorage.getItem('nk_overlay_bg_alpha');
    if (svBg !== null) {
      state.bgAlpha = clampNum(svBg, 0.10, 0.98, 0.92);
    } else {
      var legacyAl = localStorage.getItem('nk_overlay_alpha');
      if (legacyAl === 'solid') state.bgAlpha = 0.96;
      else if (legacyAl === 'mid') state.bgAlpha = 0.86;
      else if (legacyAl === 'light') state.bgAlpha = 0.56;
    }
    var svWin = localStorage.getItem('nk_overlay_win_alpha');
    if (svWin !== null) {
      state.winAlpha = clampNum(svWin, 0.35, 1.00, 1.00);
    }
  } catch (e) {}

  function log(m) { try { if (H && H.log) H.log(String(m)); else console.log('[overlay]', m); } catch (e) {} }
  function callMain(fn, arg) {
    if (H && H.callMain) H.callMain(fn, arg === undefined ? '' : JSON.stringify(arg));
    else log('callMain ' + fn + ' ' + JSON.stringify(arg));
  }
  function savePref(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }

  function closePopMenus() {
    state.menuOpen = false;
    state.cfgOpen = false;
    state.holdOpen = false;
    state.smsOpen = false;
  }

  function applyVisualStyles() {
    var bg = clampNum(state.bgAlpha, 0.10, 0.98, 0.92);
    var win = clampNum(state.winAlpha, 0.35, 1.00, 1.00);
    var light = state.theme === 'light';

    var itemAlpha = Math.max(0.10, Math.min(0.96, bg * 0.95)).toFixed(3);
    var itemOnAlpha = Math.max(0.18, Math.min(0.97, 0.10 + bg * 0.87)).toFixed(3);
    var cardAlpha = Math.max(0.10, Math.min(0.94, bg * 0.92)).toFixed(3);
    var btnAlpha = Math.max(0.22, Math.min(0.96, 0.16 + bg * 0.82)).toFixed(3);
    var colAlpha = Math.max(0.18, Math.min(0.96, bg * 0.94)).toFixed(3);
    var bdAlpha = Math.max(0.32, Math.min(1.00, 0.28 + bg * 0.72)).toFixed(3);
    var menuAlpha = Math.max(0.88, Math.min(0.99, 0.82 + bg * 0.17)).toFixed(3);

    var rootStyle = document.documentElement.style;
    rootStyle.setProperty('--ov-win-opacity', win.toFixed(2));
    if (light) {
      rootStyle.setProperty('--ov-w-bg', 'rgba(255, 255, 255, ' + bg.toFixed(3) + ')');
      rootStyle.setProperty('--ov-col-bg', 'rgba(255, 255, 255, ' + colAlpha + ')');
      rootStyle.setProperty('--ov-border', 'rgba(5, 150, 105, ' + bdAlpha + ')');
      rootStyle.setProperty('--ov-arr-border', '#D97706');
      rootStyle.setProperty('--ov-ink', '#0F172A');
      rootStyle.setProperty('--ov-muted', '#475569');
      rootStyle.setProperty('--ov-dist', '#0369A1');
      rootStyle.setProperty('--ov-item-bg', 'rgba(241, 245, 249, ' + itemAlpha + ')');
      rootStyle.setProperty('--ov-item-bd', 'rgba(148, 163, 184, ' + bdAlpha + ')');
      rootStyle.setProperty('--ov-item-on-bg', 'rgba(220, 252, 231, ' + itemOnAlpha + ')');
      rootStyle.setProperty('--ov-item-on-bd', 'rgba(22, 163, 74, ' + bdAlpha + ')');
      rootStyle.setProperty('--ov-item-on-ink', '#166534');
      rootStyle.setProperty('--ov-card-bg', 'rgba(241, 245, 249, ' + cardAlpha + ')');
      rootStyle.setProperty('--ov-card-bd', 'rgba(148, 163, 184, ' + bdAlpha + ')');

      rootStyle.setProperty('--ov-urgent-bg', 'rgba(254, 243, 199, 0.96)');

      rootStyle.setProperty('--ov-urgent-ink', '#92400E');
      rootStyle.setProperty('--ov-undo-bg', '#FEF3C7');
      rootStyle.setProperty('--ov-undo-bd', '#D97706');
      rootStyle.setProperty('--ov-undo-ink', '#92400E');

    } else {
      rootStyle.setProperty('--ov-w-bg', 'rgba(12, 20, 36, ' + bg.toFixed(3) + ')');
      rootStyle.setProperty('--ov-col-bg', 'rgba(12, 20, 36, ' + colAlpha + ')');
      rootStyle.setProperty('--ov-border', 'rgba(56, 189, 248, ' + bdAlpha + ')');
      rootStyle.setProperty('--ov-arr-border', '#F59E0B');
      rootStyle.setProperty('--ov-ink', '#F8FAFC');
      rootStyle.setProperty('--ov-muted', '#94A3B8');
      rootStyle.setProperty('--ov-dist', '#38BDF8');
      rootStyle.setProperty('--ov-item-bg', 'rgba(23, 37, 61, ' + itemAlpha + ')');
      rootStyle.setProperty('--ov-item-bd', 'rgba(71, 85, 105, ' + bdAlpha + ')');
      rootStyle.setProperty('--ov-item-on-bg', 'rgba(6, 78, 59, ' + itemOnAlpha + ')');
      rootStyle.setProperty('--ov-item-on-bd', 'rgba(52, 211, 153, ' + bdAlpha + ')');
      rootStyle.setProperty('--ov-item-on-ink', '#6EE7B7');
      rootStyle.setProperty('--ov-card-bg', 'rgba(18, 31, 52, ' + cardAlpha + ')');
      rootStyle.setProperty('--ov-card-bd', 'rgba(51, 65, 85, ' + bdAlpha + ')');
      rootStyle.setProperty('--ov-menu-bg', 'rgba(15, 23, 42, ' + menuAlpha + ')');
      rootStyle.setProperty('--ov-btn-bg', 'rgba(30, 41, 59, ' + btnAlpha + ')');
      rootStyle.setProperty('--ov-btn-bd', 'rgba(71, 85, 105, ' + bdAlpha + ')');
      rootStyle.setProperty('--ov-qty-bg', 'rgba(245, 158, 11, 0.18)');
      rootStyle.setProperty('--ov-qty-bd', 'rgba(245, 158, 11, 0.48)');
      rootStyle.setProperty('--ov-qty-ink', '#FDE047');
      rootStyle.setProperty('--ov-warn-bg', 'rgba(244, 63, 94, 0.22)');
      rootStyle.setProperty('--ov-warn-bd', 'rgba(244, 63, 94, 0.58)');
      rootStyle.setProperty('--ov-warn-ink', '#FDA4AF');
      rootStyle.setProperty('--ov-urgent-bg', 'rgba(245, 158, 11, 0.20)');
      rootStyle.setProperty('--ov-urgent-bd', 'rgba(245, 158, 11, 0.58)');
      rootStyle.setProperty('--ov-urgent-ink', '#FDE68A');
      rootStyle.setProperty('--ov-undo-bg', 'rgba(120, 53, 15, 0.92)');
      rootStyle.setProperty('--ov-undo-bd', '#F59E0B');
      rootStyle.setProperty('--ov-undo-ink', '#FEF3C7');
      rootStyle.setProperty('--ov-text-shadow', bg < 0.65 ? '0 1px 2px rgba(2,6,23,0.95), 0 0 6px rgba(2,6,23,0.85)' : 'none');
    }

    var bgPct = Math.round(bg * 100);
    var winPct = Math.round(win * 100);
    $('bgAlphaVal').textContent = bgPct + '%';
    $('winAlphaVal').textContent = winPct + '%';
    if (Number($('bgAlphaRange').value) !== bgPct) $('bgAlphaRange').value = bgPct;
    if (Number($('winAlphaRange').value) !== winPct) $('winAlphaRange').value = winPct;

    var presetBtns = $('cfgMenu').querySelectorAll('button[data-preset]');
    for (var i = 0; i < presetBtns.length; i++) {
      var key = presetBtns[i].getAttribute('data-preset');
      var pr = PRESETS[key];
      var match = pr && Math.abs(bg - pr.bg) <= 0.03 && Math.abs(win - pr.win) <= 0.03;
      presetBtns[i].classList.toggle('on', !!match);
    }
  }

  function compactBadge(raw, arrived) {
    if (arrived) return '📍 도착 ▾';
    var t = String(raw || '').replace('▾', '').trim();
    var paren = t.indexOf('(');
    if (paren > 0) t = t.slice(0, paren).trim();
    t = t.replace('최단거리 자동', '가까운순')
      .replace('가까운순 자동', '가까운순')
      .replace('납품·가까운순', '납품순')
      .replace('회수·가까운순', '회수순')
      .replace('추가·가까운순', '추가순')
      .replace('회수·내비고정', '회수·고정')
      .replace('추가납품·고정', '추가·고정')
      .replace('회수·반품', '회수')
      .replace('추가 납품', '추가');
    return t + ' ▾';
  }

  function setCollapsed(c, isManual) {
    state.collapsed = !!c;
    if (state.collapsed) {
      closePopMenus();
      state.toolsOpen = false;
    } else if (isManual) {
      state.manualExpandUntil = Date.now() + 25000;
    }
    savePref('nk_overlay_collapsed', state.collapsed ? '1' : '0');
    draw();
  }

  function draw() {
    var p = state.p || {};
    var name = p.name || '목적지 없음';
    var distText = p.distText || '거리 대기';
    var distShort = p.distShort || String(distText).replace(/^거리\s*/, '') || '거리 대기';

    w.classList.toggle('collapsed', state.collapsed);
    w.classList.toggle('sz-sm', state.size === 'sm');
    w.classList.toggle('sz-lg', state.size === 'lg');
    w.classList.toggle('theme-light', state.theme === 'light');
    w.classList.toggle('arrived', !!p.arrived);
    w.classList.toggle('ready-complete', !!p.allChecked);

    applyVisualStyles();

    // GPS dots (both expanded header & driving capsule)
    var gpsState = p.gpsState || 'off';
    var gpsTitle = gpsState === 'live' ? 'GPS 수신 양호'
      : gpsState === 'weak' ? 'GPS 약함'
      : gpsState === 'searching' ? 'GPS 탐색 중'
      : gpsState === 'manual' ? '수동 위치'
      : gpsState === 'denied' ? 'GPS 권한 필요' : 'GPS 꺼짐';
    ['gpsDot', 'colGpsDot'].forEach(function (id) {
      var dot = $(id);
      if (dot) { dot.className = 'gps-dot ' + gpsState; dot.title = gpsTitle; }
    });

    // Driving Capsule content
    $('colName').textContent = name;
    $('colDist').textContent = p.arrived ? ('📍 ' + distShort) : distShort;
    var heroQtyStr = String(p.totalQtyLabel || '').trim();
    $('colQty').textContent = heroQtyStr || (p.collapsedSummary || '수량 확인');
    var colUrg = $('colUrgent');
    var colUrgText = String(p.urgentBadge || p.linkedNote || p.pickupNote || '').trim();
    colUrg.classList.toggle('open', !!colUrgText);
    colUrg.classList.toggle('is-danger', p.urgentLevel === 'danger' || (!p.urgentBadge && !!colUrgText));
    if (colUrgText) colUrg.textContent = colUrgText;

    // Header & Pop menus
    $('badge').textContent = compactBadge(p.modeBadge || '📍 가까운순', !!p.arrived);
    $('badge').style.background = p.arrived ? '#F59E0B' : (p.modeColor || '#059669');
    $('badge').setAttribute('aria-expanded', String(state.menuOpen));
    $('alphaBtn').setAttribute('aria-expanded', String(state.cfgOpen));
    $('alphaBtn').classList.toggle('is-open', state.cfgOpen);
    $('menu').classList.toggle('open', state.menuOpen && !state.collapsed);
    $('cfgMenu').classList.toggle('open', state.cfgOpen && !state.collapsed);
    $('toolsDrawer').classList.toggle('open', state.toolsOpen && !state.collapsed);
    $('toolsToggle').classList.toggle('is-open', state.toolsOpen);
    $('toolsToggle').textContent = state.toolsOpen ? '▲' : '⋯';
    $('toolsToggle').setAttribute('aria-expanded', String(state.toolsOpen));
    $('holdMenu').classList.toggle('open', state.holdOpen && state.toolsOpen && !state.collapsed);
    $('smsMenu').classList.toggle('open', state.smsOpen && state.toolsOpen && !state.collapsed);

    // Config & Kind active buttons
    var kindButtons = $('menu').querySelectorAll('button[data-kind]');
    for (var k = 0; k < kindButtons.length; k++) {
      kindButtons[k].classList.toggle('on', kindButtons[k].getAttribute('data-kind') === state.kind);
    }
    var themeButtons = $('cfgMenu').querySelectorAll('button[data-theme]');
    for (var th = 0; th < themeButtons.length; th++) {
      themeButtons[th].classList.toggle('on', themeButtons[th].getAttribute('data-theme') === state.theme);
    }
    var sizeButtons = $('cfgMenu').querySelectorAll('button[data-size]');
    for (var sIdx = 0; sIdx < sizeButtons.length; sIdx++) {
      sizeButtons[sIdx].classList.toggle('on', sizeButtons[sIdx].getAttribute('data-size') === state.size);
    }
    var naviButtons = $('cfgMenu').querySelectorAll('button[data-navi]');
    for (var nv = 0; nv < naviButtons.length; nv++) {
      naviButtons[nv].classList.toggle('on', naviButtons[nv].getAttribute('data-navi') === state.naviApp);
    }

    var tsBtn = $('themeSyncToggle');
    if (tsBtn) {
      tsBtn.classList.toggle('on', state.themeSync);
      tsBtn.textContent = state.themeSync ? '🔄 메인 앱 테마 자동동기화: 켜짐' : '🔄 메인 앱 테마 자동동기화: 수동';
    }
    var adBtn = $('autoDriveToggle');
    if (adBtn) {
      var radTxt = p.radiusMeters ? (' (' + p.radiusMeters + 'm)') : '';
      adBtn.classList.toggle('on', state.autoDrive);
      adBtn.textContent = state.autoDrive
        ? ('🚗 주행캡슐↔도착 자동전환: 켜짐' + radTxt)
        : '🚗 주행캡슐↔도착 자동전환: 꺼짐';
    }
    var anBtn = $('autoNearToggle');
    if (anBtn) {
      var autoOn = p.autoNearest !== false;
      anBtn.classList.toggle('on', autoOn);
      anBtn.textContent = autoOn ? '📍 가까운 원 자동전환: 켜짐' : '🔒 고정 유지 (자동전환 꺼짐)';
    }
    var unBtn = $('unlockNearBtn');
    if (unBtn) unBtn.style.display = p.isLocked ? 'block' : 'none';

    var hdBtn = $('holdDoneToggle');
    hdBtn.classList.toggle('on', state.holdDone);
    hdBtn.textContent = state.holdDone ? '🔒 완료 길게누르기: 켜짐 (0.6초)' : '🔒 완료 길게누르기: 꺼짐';

    // Quick target switcher list inside #menu
    var remCount = typeof p.remainingCount === 'number' ? p.remainingCount : 0;
    $('remCountLabel').textContent = remCount ? ('남은 ' + remCount + '곳') : '';
    var qlBox = $('quickList');
    qlBox.textContent = '';
    var qList = Array.isArray(p.quickList) ? p.quickList : [];
    if (!qList.length) {
      var qEmpty = document.createElement('div');
      qEmpty.className = 'empty';
      qEmpty.style.fontSize = '10px';
      qEmpty.textContent = '남은 정거장이 없습니다.';
      qlBox.appendChild(qEmpty);
    } else {
      qList.forEach(function (qt) {
        var qb = document.createElement('button');
        qb.type = 'button';
        qb.className = 'quick-target-btn' + (qt.active ? ' on' : '');
        qb.setAttribute('data-target-key', String(qt.key || ''));
        var spName = document.createElement('span');
        spName.className = 'qt-name';
        spName.textContent = (qt.active ? '✓ ' : '') + (qt.name || '');
        var spMeta = document.createElement('span');
        spMeta.className = 'qt-meta';
        spMeta.textContent = [qt.distText, qt.summary].filter(Boolean).join(' · ');
        qb.appendChild(spName);
        qb.appendChild(spMeta);
        qlBox.appendChild(qb);
      });
    }

    // Undo bar
    var undoText = String(p.undoLabel || '').trim();
    $('undoBar').classList.toggle('open', !!undoText && !state.collapsed);
    if (undoText) $('undoBar').textContent = '↩ ' + undoText + ' 완료 취소';

    // Expanded Header distance
    var weakAcc = (gpsState === 'weak' && p.gpsAccuracy) ? (' (±' + p.gpsAccuracy + 'm)') : '';
    $('dist').textContent = distText + weakAcc;

    // 0.5-Second Quantity Hero Card
    $('title').textContent = name;
    var stepLine = String(p.stepSummary || p.progressText || '').trim();
    $('heroSteps').textContent = stepLine || '수량 확인';
    var hq = $('heroQty');
    if (heroQtyStr) {
      hq.textContent = heroQtyStr;
      hq.classList.remove('hidden');
    } else {
      hq.textContent = '';
      hq.classList.add('hidden');
    }

    // Urgent time window & Linked pickup warning strips
    var urgStr = String(p.urgentBadge || '').trim();
    var urgEl = $('urgentStrip');
    urgEl.classList.toggle('open', !!urgStr);
    urgEl.classList.toggle('is-danger', p.urgentLevel === 'danger');
    if (urgStr) urgEl.textContent = urgStr;

    var linkStr = String(p.linkedNote || p.pickupNote || '').trim();
    var linkEl = $('linkedStrip');
    linkEl.classList.toggle('open', !!linkStr);
    if (linkStr) linkEl.textContent = linkStr;

    // Address toggle
    var addr = String(p.address || '').trim();
    $('addrBtn').disabled = !addr;
    $('addrBtn').setAttribute('aria-expanded', String(state.addrOpen && !!addr));
    $('addrBar').classList.toggle('open', state.addrOpen && !!addr && !state.collapsed);
    if (addr) $('addrText').textContent = addr;

    // Memo bar & quick chips
    var memoStr = String(p.memo || '').trim();
    var memoBtn = $('memoBtn');
    var hasTarget = p.targetKind !== 'none' && name !== '모든 납품·회수 완료!' && name !== '선택한 종류의 미완료 업무 없음' && name !== '목적지 준비중';
    if (hasTarget) {
      memoBtn.classList.remove('hidden');
      memoBtn.classList.toggle('empty-memo', !memoStr);
      memoBtn.classList.toggle('expanded', state.memoExpanded);
      memoBtn.setAttribute('aria-expanded', String(state.memoExpanded));
      $('memoText').textContent = memoStr ? ('📝 ' + memoStr) : '📝 + 현장 메모 추가';
      $('memoChips').classList.toggle('open', state.memoExpanded && !state.collapsed);
    } else {
      memoBtn.classList.add('hidden');
      $('memoChips').classList.remove('open');
    }

    // Secondary tools state
    var hasPhone = !!String(p.phone || '').replace(/[^0-9+*#]/g, '');
    $('callBtn').disabled = !hasPhone;
    $('callBtn').textContent = hasPhone ? '📞 전화' : '📞 없음';
    $('smsBtn').disabled = !hasPhone;
    $('smsBtn').textContent = hasPhone ? '📩 문자' : '📩 없음';

    var pCnt = Number(p.photoCount || 0);
    var canPhoto = !!(p.schoolId || p.targetKind === 'delivery');
    $('photoBtn').disabled = !hasTarget || !canPhoto;
    $('photoBtn').textContent = pCnt > 0 ? ('📷 사진(' + pCnt + ')') : '📷 사진';

    var nm = NAVI_META[state.naviApp] || NAVI_META.naver;
    $('naviBtn').textContent = nm.text;
    $('naviBtn').title = nm.title;
    $('naviBtn').className = nm.cls;

    // Checklist & Check-All
    var items = Array.isArray(p.items) ? p.items : [];
    var checkedItems = items.filter(function (it) { return !!it.checked; }).length;
    $('progress').textContent = items.length
      ? ('품목 체크 ' + checkedItems + '/' + items.length + (p.allChecked ? ' · 준비완료!' : ''))
      : (p.progressText || '품목 터치 시 즉시 체크');
    var hasUncheckedCheckable = items.some(function (it) { return (typeof it.index !== 'number' || it.index < 1000) && !it.checked; });
    $('checkAllBtn').classList.toggle('hidden', !hasUncheckedCheckable);

    var box = $('items');
    box.textContent = '';
    if (!items.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '표시할 품목이 없습니다.';
      box.appendChild(empty);
    }
    items.forEach(function (it, i) {
      var idx = typeof it.index === 'number' ? it.index : i;
      var row = document.createElement('div');
      row.className = 'item-row';

      var b = document.createElement('button');
      b.type = 'button';
      var kindCls = it.kind === 'linked-pickup' ? ' linked' : (it.kind === 'linked-extra' ? ' linked-extra' : '');
      b.className = 'item' + (it.checked ? ' on' : '') + kindCls;
      var txt = document.createElement('span');
      txt.className = 'it-txt';
      txt.textContent = (it.checked ? '☑ ' : '☐ ') + (it.label || '');
      b.appendChild(txt);
      b.addEventListener('click', function () { callMain('onNativeOverlayToggleItem', idx); });
      row.appendChild(b);

      if (it.adjustable && Number(it.qty || 0) > 1) {
        var sw = document.createElement('div');
        sw.className = 'step-wrap';
        var curDelivered = Number(it.deliveredQty || 0);

        var minus = document.createElement('button');
        minus.type = 'button';
        minus.className = 'step-btn';
        minus.textContent = '−';
        minus.disabled = curDelivered <= 0;
        minus.setAttribute('aria-label', (it.label || '') + ' 수량 1 감소');
        minus.addEventListener('click', function (ev) {
          ev.stopPropagation();
          callMain('onNativeOverlayStepItem', idx + ':-1');
        });

        var plus = document.createElement('button');
        plus.type = 'button';
        plus.className = 'step-btn';
        plus.textContent = '+';
        plus.disabled = curDelivered >= Number(it.qty);
        plus.setAttribute('aria-label', (it.label || '') + ' 수량 1 증가');
        plus.addEventListener('click', function (ev) {
          ev.stopPropagation();
          callMain('onNativeOverlayStepItem', idx + ':1');
        });

        sw.appendChild(minus);
        sw.appendChild(plus);
        row.appendChild(sw);
      }

      box.appendChild(row);
    });

    // Next stop preview inside tools drawer
    var np = p.nextPreview;
    var npEl = $('nextPreview');
    if (np && np.name) {
      npEl.classList.add('open');
      $('nextPrevName').textContent = '다음 ▶ ' + np.name + (np.summary ? ' · ' + np.summary : '');
      $('nextPrevMeta').textContent = [np.distText, remCount > 1 ? (remCount + '곳') : ''].filter(Boolean).join(' · ');
    } else {
      npEl.classList.remove('open');
    }

    reportSize();
  }

  var lastW = 0, lastH = 0;
  function reportSize() {
    requestAnimationFrame(function () {
      var r = w.getBoundingClientRect();
      var cw = Math.ceil(r.width), ch = Math.ceil(r.height);
      if (cw === lastW && ch === lastH) return;
      lastW = cw; lastH = ch;
      if (H && H.setSize) H.setSize(cw, ch);
    });
  }
  if (window.ResizeObserver) new ResizeObserver(reportSize).observe(w);

  // ---- 네이티브에서 호출 ----
  window.nkRender = function (payload) {
    try {
      var p = payload || {};
      state.p = p;
      if (typeof p.kindChoice === 'string') state.kind = p.kindChoice;

      // Sync theme with main app sunlight/dark mode automatically
      if (state.themeSync && (p.appTheme === 'light' || p.appTheme === 'dark')) {
        state.theme = p.appTheme;
      }

      // Smart Driving Capsule ↔ Arrival Card auto-switch
      var now = Date.now();
      var isNear = !!(p.nearby || p.arrived);
      if (state.autoDrive) {
        if (isNear && state.lastNearby !== true && state.collapsed && now >= state.autoExpandSuppressUntil) {
          state.collapsed = false;
          savePref('nk_overlay_collapsed', '0');
        } else if (!isNear && state.lastNearby === true && !state.collapsed && now >= state.manualExpandUntil
            && !state.menuOpen && !state.cfgOpen && !state.toolsOpen && !state.holdOpen && !state.smsOpen) {
          state.collapsed = true;
          closePopMenus();
          savePref('nk_overlay_collapsed', '1');
        }
      }
      state.lastNearby = isNear;

      draw();
      if (p.latestOverlayVersion && String(p.latestOverlayVersion) !== VERSION) {
        applyOverlaySelfUpdate('render:' + p.latestOverlayVersion, 'ver:' + p.latestOverlayVersion);
      } else if (p.overlayAssetSig && ovKnownHeaderSig && p.overlayAssetSig !== ovKnownHeaderSig) {
        applyOverlaySelfUpdate('render-sig', 'hdr:' + p.overlayAssetSig);
      }
    } catch (e) { log('render error ' + e); }
  };
  window.nkSetCollapsed = function (c) { setCollapsed(c, false); };

  // ---- 주행 캡슐 조작 ----
  $('pillTapZone').addEventListener('click', function () { setCollapsed(false, true); });
  $('colQty').addEventListener('click', function () { setCollapsed(false, true); });
  $('colExpand').addEventListener('click', function (e) { e.stopPropagation(); setCollapsed(false, true); });

  // ---- 헤더 · 메뉴 ----
  $('badge').addEventListener('click', function () {
    var next = !state.menuOpen;
    closePopMenus();
    state.menuOpen = next;
    draw();
  });
  $('alphaBtn').addEventListener('click', function () {
    var next = !state.cfgOpen;
    closePopMenus();
    state.cfgOpen = next;
    draw();
  });
  $('toolsToggle').addEventListener('click', function () {
    state.toolsOpen = !state.toolsOpen;
    if (!state.toolsOpen) {
      state.holdOpen = false;
      state.smsOpen = false;
    }
    draw();
  });

  $('menu').addEventListener('click', function (e) {
    if (e.target.closest('#unlockNearBtn')) {
      state.kind = 'auto';
      state.menuOpen = false;
      draw();
      callMain('onNativeOverlayAutoNearest');
      return;
    }
    var kb = e.target.closest('button[data-kind]');
    if (kb) {
      state.kind = kb.getAttribute('data-kind');
      state.menuOpen = false;
      draw();
      callMain('onNativeOverlaySelectKind', state.kind);
      return;
    }
    var qt = e.target.closest('button[data-target-key]');
    if (qt) {
      var key = qt.getAttribute('data-target-key');
      state.menuOpen = false;
      draw();
      callMain('onNativeOverlaySelectTarget', key);
    }
  });

  // Transparency & visual settings listeners
  function setBgAlpha(v) {
    state.bgAlpha = Math.round(clampNum(v, 0.10, 0.98, 0.92) * 100) / 100;
    savePref('nk_overlay_bg_alpha', state.bgAlpha);
    applyVisualStyles();
  }
  function setWinAlpha(v) {
    state.winAlpha = Math.round(clampNum(v, 0.35, 1.00, 1.00) * 100) / 100;
    savePref('nk_overlay_win_alpha', state.winAlpha);
    applyVisualStyles();
  }

  $('bgAlphaRange').addEventListener('input', function (e) { setBgAlpha(Number(e.target.value) / 100); });
  $('winAlphaRange').addEventListener('input', function (e) { setWinAlpha(Number(e.target.value) / 100); });

  $('cfgMenu').addEventListener('click', function (e) {
    var bgStep = e.target.closest('button[data-bg-step]');
    if (bgStep) {
      setBgAlpha(state.bgAlpha + parseInt(bgStep.getAttribute('data-bg-step'), 10) / 100);
      return;
    }
    var winStep = e.target.closest('button[data-win-step]');
    if (winStep) {
      setWinAlpha(state.winAlpha + parseInt(winStep.getAttribute('data-win-step'), 10) / 100);
      return;
    }
    var pb = e.target.closest('button[data-preset]');
    if (pb) {
      var pr = PRESETS[pb.getAttribute('data-preset')];
      if (pr) {
        state.bgAlpha = pr.bg;
        state.winAlpha = pr.win;
        savePref('nk_overlay_bg_alpha', state.bgAlpha);
        savePref('nk_overlay_win_alpha', state.winAlpha);
        applyVisualStyles();
      }
      return;
    }
    var tb = e.target.closest('button[data-theme]');
    if (tb) {
      state.theme = tb.getAttribute('data-theme');
      state.themeSync = false;
      savePref('nk_overlay_theme', state.theme);
      savePref('nk_overlay_theme_sync', '0');
      draw();
      return;
    }
    var sb = e.target.closest('button[data-size]');
    if (sb) {
      state.size = sb.getAttribute('data-size');
      savePref('nk_overlay_size', state.size);
      draw();
      return;
    }
    var nb = e.target.closest('button[data-navi]');
    if (nb) {
      state.naviApp = nb.getAttribute('data-navi');
      savePref('nk_overlay_navi_app', state.naviApp);
      draw();
      return;
    }
  });

  $('themeSyncToggle').addEventListener('click', function () {
    state.themeSync = !state.themeSync;
    savePref('nk_overlay_theme_sync', state.themeSync ? '1' : '0');
    if (state.themeSync && state.p && (state.p.appTheme === 'light' || state.p.appTheme === 'dark')) {
      state.theme = state.p.appTheme;
    }
    draw();
  });
  $('autoDriveToggle').addEventListener('click', function () {
    state.autoDrive = !state.autoDrive;
    savePref('nk_overlay_auto_drive', state.autoDrive ? '1' : '0');

  $('snapEdgeBtn').addEventListener('click', function () {
    if (H && H.snapEdge) H.snapEdge('toggle');

  // ---- 주소 · 메모 · 전체체크 ----
  $('undoBar').addEventListener('click', function () { callMain('onNativeOverlayUndoComplete'); });
  $('addrBtn').addEventListener('click', function () {

  // ---- 보조 도구 서랍 ----
  $('callBtn').addEventListener('click', function () {
    var phone = String((state.p && state.p.phone) || '');

  $('smsBtn').addEventListener('click', function () {

  $('smsMenu').addEventListener('click', function (e) {

    state.smsOpen = false;

  $('photoBtn').addEventListener('click', function () {

  function triggerSpeak(e) {

  }
  $('speakBtn').addEventListener('click', triggerSpeak);
  $('colSpeak').addEventListener('click', triggerSpeak);

  $('holdBtn').addEventListener('click', function () {
    var next = !state.holdOpen;

    draw();

  $('holdMenu').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-status]');
    if (!b) return;
    state.holdOpen = false;
    state.toolsOpen = false;
    draw();
    callMain('onNativeOverlayQuickStatus', b.getAttribute('data-status'));
  });

  function startNavi() {
    state.autoExpandSuppressUntil = Date.now() + 3000;
    setCollapsed(true, false);
    var p = state.p || {};
    if (state.naviApp === 'kakao') {
      if (H && H.launchNaviUrl) H.launchNaviUrl(p.kakaoUrl || '', p.kakaoWebUrl || p.webNaviUrl || '');
      else callMain('onNativeOverlayStartCustomNavi', 'kakao');
      return;
    }
    if (state.naviApp === 'tmap') {
      if (H && H.launchNaviUrl) H.launchNaviUrl(p.tmapUrl || '', p.tmapWebUrl || p.webNaviUrl || '');
      else callMain('onNativeOverlayStartCustomNavi', 'tmap');
      return;
    }
    if (H && H.startNavi) H.startNavi(); else log('startNavi');
  }
  $('naviBtn').addEventListener('click', startNavi);

  $('nextPreview').addEventListener('click', function () {
    var np = state.p && state.p.nextPreview;
    if (np && np.key) callMain('onNativeOverlaySelectTarget', String(np.key));
  });

  $('collapse').addEventListener('click', function () { setCollapsed(true, true); });
  $('close').addEventListener('click', function () {
    state.cfgOpen = false;
    if (H && H.close) H.close(); else log('close');
  });

  // Hold-to-complete binding on #done and #doneNext
  var hintTimer = null;
  function showHoldHint() {
    clearTimeout(hintTimer);
    $('holdHint').classList.add('open');
    reportSize();
    hintTimer = setTimeout(function () {
      $('holdHint').classList.remove('open');
      reportSize();
    }, 1800);
  }
  function bindHoldAction(btn, actionFn) {
    var timer = null;
    var fired = false;
    btn.addEventListener('pointerdown', function (e) {
      if (!state.holdDone || e.button > 0) return;
      fired = false;
      btn.classList.add('holding');
      clearTimeout(timer);
      timer = setTimeout(function () {
        timer = null;
        fired = true;
        btn.classList.remove('holding');
        actionFn();
      }, 550);
    });
    function cancelHold() {
      if (timer) {
        clearTimeout(timer);
        timer = null;
        btn.classList.remove('holding');
        if (state.holdDone && !fired) showHoldHint();
      } else {
        btn.classList.remove('holding');
      }
    }
    btn.addEventListener('pointerup', cancelHold);
    btn.addEventListener('pointercancel', cancelHold);
    btn.addEventListener('pointerleave', function () {
      if (timer) { clearTimeout(timer); timer = null; }
      btn.classList.remove('holding');
    });
    btn.addEventListener('click', function (e) {
      if (state.holdDone) {
        if (fired) { fired = false; e.preventDefault(); return; }
        if (e.detail === 0) { actionFn(); return; }
        e.preventDefault();
        return;
      }
      actionFn();
    });
  }
  bindHoldAction($('done'), function () { callMain('onNativeOverlayCompleteTarget'); });
  bindHoldAction($('doneNext'), function () {
    state.autoExpandSuppressUntil = Date.now() + 3000;
    setCollapsed(true, false);
    callMain('onNativeOverlayCompleteAndNext', state.naviApp);
  });

  $('next').addEventListener('click', function () { callMain('onNativeOverlayNextTarget'); });
  $('app').addEventListener('click', function () { if (H && H.openApp) H.openApp(); else log('openApp'); });

  // ---- 드래그 손잡이: 주행 캡슐·헤더·히어로 카드 ----
  function armDrag(e) {
    if (e.target.closest('button')) return;
    if (H && H.beginDrag) H.beginDrag();
  }
  $('drivingPill').addEventListener('pointerdown', armDrag);
  $('header').addEventListener('pointerdown', armDrag);
  $('heroCard').addEventListener('pointerdown', armDrag);

  // ---- 미니창 자동 업데이트 (APK 재설치 없이 웹 반영) ----
  var OV_UPD_GUARD_KEY = 'nk_ov_self_upd_v1';
  var ovKnownHeaderSig = '';
  var ovBootLastModMs = (function () {
    try {
      var t = Date.parse(document.lastModified || '');
      return isFinite(t) ? t : 0;
    } catch (e) { return 0; }
  })();
  var ovBootAt = Date.now();
  var ovCheckInFlight = false;
  var ovApplying = false;
  var ovLastCheckAt = 0;
  var ovPendingReload = null;

  function canReloadOverlayNow() {
    if (state.menuOpen || state.cfgOpen || state.toolsOpen || state.holdOpen || state.smsOpen) return false;
    try {
      if (document.querySelector('.holding')) return false;
    } catch (e) {}
    return true;
  }

  function readOvGuard() {
    try {
      var raw = sessionStorage.getItem(OV_UPD_GUARD_KEY);
      var parsed = raw ? JSON.parse(raw) : null;
      if (parsed && typeof parsed === 'object') return parsed;
    } catch (e) {}
    return { lastSig: '', lastAt: 0, count: 0, windowStart: Date.now() };
  }

  function canAutoReloadOverlay(sig) {
    if (!sig) return false;
    var now = Date.now();
    var rec = readOvGuard();
    if (!rec.windowStart || (now - rec.windowStart) > 300000) return true;
    if (rec.count >= 2) return false;
    if (rec.lastSig === sig && (now - rec.lastAt) < 120000) return false;
    return true;
  }

  function markOvReloadGuard(sig) {
    var now = Date.now();
    var rec = readOvGuard();
    var reset = !rec.windowStart || (now - rec.windowStart) > 300000;
    var next = {
      lastSig: sig || '',
      lastAt: now,
      windowStart: reset ? now : rec.windowStart,
      count: reset ? 1 : (Number(rec.count || 0) + 1)
    };
    try { sessionStorage.setItem(OV_UPD_GUARD_KEY, JSON.stringify(next)); } catch (e) {}
  }

  function seedOvHeaderBaseline() {
    if (!/^https?:/.test(location.protocol) || !('caches' in window)) return Promise.resolve();
    var target = new URL('overlay.html', location.href).href;
    return caches.match(target, { ignoreSearch: true }).then(function (res) {
      if (!res) return;
      var etag = res.headers.get('etag') || '';
      var lm = res.headers.get('last-modified') || '';
      var sig = [etag, lm].join('|');
      if (sig && sig !== '|' && !ovKnownHeaderSig) ovKnownHeaderSig = sig;
    }).catch(function () {});
  }

  function applyOverlaySelfUpdate(reason, sig) {
    if (ovApplying) return;
    if (!/^https?:/.test(location.protocol)) return;
    if (/[?&]demo=1/.test(location.search)) return;
    if (navigator.onLine === false) return;
    if (!canAutoReloadOverlay(sig)) return;

    if (!canReloadOverlayNow()) {
      ovPendingReload = { reason: reason, sig: sig };
      return;
    }

    ovApplying = true;
    ovPendingReload = null;
    try {
      var nextUrl = new URL(window.location.href);
      nextUrl.searchParams.set('nk_upd', String(Date.now()));
      var targetHref = nextUrl.toString();
      fetch(targetHref, { cache: 'reload' }).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      }).then(function (html) {
        if (!html || html.indexOf('WEB_OVERLAY_SHELL_V1') === -1 || html.indexOf('window.nkRender') === -1) {
          throw new Error('Invalid overlay markup');
        }
        if (!canReloadOverlayNow()) {
          ovPendingReload = { reason: reason, sig: sig };
          ovApplying = false;
          return;
        }
        markOvReloadGuard(sig);
        log('overlay self-update: ' + reason);
        window.location.replace(targetHref);
      }).catch(function (err) {
        ovApplying = false;
        log('overlay self-update deferred: ' + err);
      });
    } catch (e) {
      ovApplying = false;
    }
  }

  function checkOverlaySelfUpdate(forceCheck) {
    if (ovApplying || ovCheckInFlight) return;
    if (!/^https?:/.test(location.protocol)) return;
    if (/[?&]demo=1/.test(location.search)) return;
    if (navigator.onLine === false) return;

    var now = Date.now();
    if (!forceCheck && (now - ovLastCheckAt < 30000)) return;
    ovLastCheckAt = now;
    ovCheckInFlight = true;

    fetch('./version.json?t=' + now, { cache: 'no-store' }).then(function (res) {
      if (!res.ok) return null;
      return res.json();
    }).then(function (meta) {
      if (meta && meta.overlayVersion && String(meta.overlayVersion) !== VERSION) {
        ovCheckInFlight = false;
        applyOverlaySelfUpdate('version.json:' + meta.overlayVersion, 'ver:' + meta.overlayVersion);
        return null;
      }
      return fetch('./overlay.html?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
    }).then(function (headRes) {
      ovCheckInFlight = false;
      if (!headRes || !headRes.ok) return;
      var etag = headRes.headers.get('etag') || '';
      var lm = headRes.headers.get('last-modified') || '';
      var sig = [etag, lm].join('|');
      if (!ovKnownHeaderSig) {
        ovKnownHeaderSig = (sig && sig !== '|') ? sig : '';
        if (lm) {
          var srvMs = Date.parse(lm);
          if (isFinite(srvMs) && ovBootLastModMs > 0 && Math.abs(ovBootLastModMs - ovBootAt) > 10000 && (srvMs - ovBootLastModMs) > 5000 && srvMs <= (Date.now() + 60000)) {
            applyOverlaySelfUpdate('lastMod:' + lm, 'hdr:' + (sig || lm));
          }
        }
        return;
      }
      if (sig && sig !== '|' && sig !== ovKnownHeaderSig) {
        applyOverlaySelfUpdate('header:' + sig, 'hdr:' + sig);
      }
    }).catch(function () {
      ovCheckInFlight = false;
    });
  }

  if ($('ovVerLabel')) $('ovVerLabel').textContent = VERSION;
  draw();
  if (H && H.ready) {
    H.ready(VERSION);
  } else if (/[?&]demo=1/.test(location.search)) {
    document.body.style.background = 'linear-gradient(135deg, #cbd5e1 0%, #94a3b8 50%, #475569 100%)';
    document.body.style.minHeight = '100vh';
    document.body.style.padding = '12px';
    window.nkRender({
      modeBadge: '🧭 내비고정', modeColor: '#059669', name: '1. 달빛유치원',
      schoolId: 1,
      distText: '거리 85m', distShort: '85m', gpsState: 'live', gpsAccuracy: 12,
      radiusMeters: 250,
      appTheme: 'dark',
      totalQtyLabel: '총 115개',
      stepSummary: '3단계 111 · 교사 4',
      urgentBadge: '⏰ 마감 임박 · 오전 필수',
      urgentLevel: 'danger',
      linkedNote: '↩️ [회수/추가 1건] 2단계 반품 (3개)',
      photoCount: 1,
      address: '경기도 김포시 고촌읍 태리로 261-6',
      phone: '031-987-2730', memo: '정문 우측 주차 · 2층 교무실', pickupNote: '↩️ 회수·반품 1건',
      progressText: '품목체크 1/4 · 총 115개', kindChoice: 'auto', nearby: true, arrived: true, allChecked: false,
      remainingCount: 4,
      collapsedSummary: '달빛유치원 · 85m · 총 115개',
      nextPreview: { key: '2', name: '2. 모담유치원', distText: '1.4km', summary: '총 251개' },
      quickList: [
        { key: '1', name: '1. 달빛유치원', distText: '85m', summary: '총 115개', kind: 'delivery', active: true },
        { key: '2', name: '2. 모담유치원', distText: '1.4km', summary: '총 251개', kind: 'delivery', active: false },
        { key: '3', name: '3. 별빛어린이집', distText: '2.8km', summary: '총 42개', kind: 'delivery', active: false }
      ],
      smsBodies: {
        arriving: '[엔터코딩] 안녕하세요, 달빛유치원입니다. 잠시 후 교재 납품 방문 예정입니다.',
        delivered: '[엔터코딩] 달빛유치원 교재(총 115개) 전달 완료했습니다. 감사합니다.',
        absent: '[엔터코딩] 달빛유치원 방문드렸으나 부재중이셔서 문자 남깁니다.'
      },
      items: [
        { index: 0, checked: true, label: '3단계 (학생용) : 111개', qty: 111, deliveredQty: 111, adjustable: true, kind: 'delivery' },
        { index: 1, checked: false, label: '3단계 (교사용) : 4개', qty: 4, deliveredQty: 0, adjustable: true, kind: 'delivery' },
        { index: 1000, checked: false, label: '↩️ [회수] 2단계 반품 (3개)', qty: 3, deliveredQty: 0, adjustable: false, kind: 'linked-pickup' }
      ]
    });
  }

  if (/^https?:/.test(location.protocol) && !/[?&]demo=1/.test(location.search)) {
    seedOvHeaderBaseline().then(function () {
      setTimeout(function () { checkOverlaySelfUpdate(true); }, 2500);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) checkOverlaySelfUpdate(false);
    });
    setInterval(function () {
      if (ovPendingReload && canReloadOverlayNow()) {
        var p = ovPendingReload;
        ovPendingReload = null;
        applyOverlaySelfUpdate(p.reason, p.sig);
      }
    }, 3000);
    setInterval(function () {
      if (!document.hidden) checkOverlaySelfUpdate(false);
    }, 4 * 60 * 1000);
  }
})();
