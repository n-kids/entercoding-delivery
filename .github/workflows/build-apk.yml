name: Build Android APK (엔터코딩 납품알리미)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Background Plugins
        run: npm install

      - name: Initialize & Sync Android Project
        run: |
          npm run prepare:www
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node scripts/configure-android.mjs
          npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Installable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: entercoding-delivery-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
