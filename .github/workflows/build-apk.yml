name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Initialize and sync Android project
        run: |
          npm run prepare:www

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          node scripts/configure-android.mjs
          npx cap sync android

      - name: Set increasing Android version code
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          source = path.read_text()
          version = 100000 + int(os.environ["BUILD_NUMBER"])

          source, count = re.subn(
              r"\bversionCode\s+\d+",
              f"versionCode {version}",
              source,
              count=1
          )

          if count != 1:
              raise SystemExit("versionCode not found in android/app/build.gradle")

          path.write_text(source)
          print(f"Android versionCode: {version}")
          PY

      - name: Build release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Required signing secrets are missing."
            exit 1
          fi

          umask 077
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/delivery-release.p12"

          keytool -list \
            -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/delivery-release.p12" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias delivery

      - name: Align, sign and verify APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path is not available."
            exit 1
          fi

          BUILD_TOOLS="$(
            find "$SDK_ROOT/build-tools" \
              -mindepth 1 -maxdepth 1 -type d \
              | sort -V | tail -n 1
          )"

          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          INPUT="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$INPUT" ]; then
            echo "Unsigned release APK was not found."
            exit 1
          fi

          mkdir -p signed-apk

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$INPUT" \
            "$RUNNER_TEMP/delivery-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/delivery-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias delivery \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "signed-apk/entercoding-delivery-signed.apk" \
            "$RUNNER_TEMP/delivery-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "signed-apk/entercoding-delivery-signed.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: entercoding-delivery-signed-apk
          path: signed-apk/entercoding-delivery-signed.apk
          if-no-files-found: error

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/delivery-release.p12"
          rm -f "$RUNNER_TEMP/delivery-aligned.apk"
